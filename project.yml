# Alternativa al .xcodeproj incluido: si prefieres regenerarlo, instala
# XcodeGen (brew install xcodegen) y ejecuta `xcodegen generate` aquí.
name: Autodefinidos
options:
  bundleIdPrefix: com.autodefinidos
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Autodefinidos:
    type: application
    platform: iOS
    sources:
      - path: Autodefinidos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autodefinidos.libro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Autodefinidos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
